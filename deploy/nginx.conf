# Same routing as vercel.json: locale SPAs under /en-US, /ja, /ko, /zh; everything else falls back to en-US.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = / { return 301 /en-US/; }
    location = /sitemap.xml  { try_files /en-US/sitemap.xml =404; }
    location = /robots.txt   { try_files /en-US/robots.txt =404; }
    location = /_routes.json { try_files /en-US/_routes.json =404; }

    location /en-US/ { try_files $uri /en-US/index.html; }
    location /ja/    { try_files $uri /ja/index.html; }
    location /ko/    { try_files $uri /ko/index.html; }
    location /zh/    { try_files $uri /zh/index.html; }
    location /       { try_files /en-US/index.html =404; }

    # The locale builds are not output-hashed (main.js etc. keep their names), so code + data must revalidate
    # (ETag / 304) on every load or a deploy would mix old JS with new HTML. Images change rarely: 1 day.
    location ~* \.(?:html|js|css|json|xml|txt)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
}
