name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - master
    tags:
      - "v*.*.*" # Triggers when version tags like v2.0.1 are created

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm run test-ci
        env:
          CI: true

  # Builds the production image (Dockerfile) so a broken image never reaches master. The homelab cluster
  # deploys a master commit only after these checks pass (pull-based, see README "Deploying the Game").
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t bardle:ci .

      - name: Smoke test
        run: |
          docker run -d --name bardle -p 8080:8080 bardle:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          for p in /en-US/ /ja/ /ko/ /zh/ /en-US/some/route; do
            curl -fs -o /dev/null "http://localhost:8080$p" || { echo "GET $p failed"; docker logs bardle; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 301

  create-release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') # Only run if a tag like v2.0.1 is pushed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Read CHANGELOG.md for release notes
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
            awk '/## ${{ env.VERSION }}/,0' CHANGELOG.md | tail -n +2 >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "RELEASE_NOTES=No release notes provided." >> $GITHUB_ENV
          fi

      - name: Create GitHub Release (Source Code Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
