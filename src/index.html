<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Domain move bardle.starsbit.space -> bardle.starsbit.moe: hand the saved game (streaks, guesses, settings
         live in localStorage, which is per domain) over in the URL fragment, and import it on the new domain. -->
    <script>
      (function () {
        var OLD = 'bardle.starsbit.space', NEW = 'bardle.starsbit.moe', TAG = '#bardle-transfer=';
        try {
          if (location.hostname === OLD) {
            var data = {};
            for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); }
            var payload = Object.keys(data).length ? TAG + encodeURIComponent(JSON.stringify(data)) : '';
            location.replace('https://' + NEW + location.pathname + location.search + payload);
          } else if (location.hash.indexOf(TAG) === 0) {
            var saved = JSON.parse(decodeURIComponent(location.hash.slice(TAG.length)));
            for (var key in saved) { if (localStorage.getItem(key) === null) localStorage.setItem(key, saved[key]); }
            history.replaceState(null, '', location.pathname + location.search);
          }
        } catch (e) {
          if (location.hostname === OLD) location.replace('https://' + NEW + location.pathname + location.search);
        }
      })();
    </script>
    <meta charset="utf-8" />
    <title>Bardle - Blue Archive Wordle Guessing Game</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Guess the hidden Blue Archive student in 6 tries. A new student to guess is available each day."
    />

    <meta property="og:description" content="Guess the hidden Blue Archive student in 6 tries. A new student to guess is available each day." />

    <meta property="og:site_name" content="Bardle" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
